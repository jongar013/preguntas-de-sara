<style>
/* Layout: a game table. Home = a shelf of chunky colour decks; play = one physical card on the deck's colour, thrown away with a swipe. Single dark look by choice. */
:root {
  --table: #1E1633;
  --table-2: #2A2047;
  --ink: #1E1633;
  --card: #FFFFFF;
  --muted-ink: #5E5574;
  --soft: #F1EEF8;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; overflow-x: hidden; }
body { background: var(--table); color: #fff; font-family: var(--font-body); font-size: 16px; transition: background-color .35s ease; overflow: hidden; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
svg.i { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; }

/* ---------- Home ---------- */
#home { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding-bottom: 18px; scrollbar-width: none; }
.logo { padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.logo .cover { width: clamp(92px, 27vw, 128px); aspect-ratio: 1; max-width: 100%; flex: none; object-fit: cover; border-radius: 26px; border: 4px solid #fff;
  box-shadow: 5px 5px 0 #FF5A8A; transform: rotate(5deg); }
.logo h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.3rem, 10.5vw, 3.4rem); line-height: .95; min-width: 0; margin: 0;
  color: #FFD84A; text-shadow: 4px 4px 0 #FF5A8A; transform: rotate(-3deg); transform-origin: left center; display: inline-block; letter-spacing: .01em; }
.logo p { margin: 14px 0 0; color: #CFC6E6; font-weight: 700; font-size: 1.02rem; line-height: 1.4; max-width: 30ch; }

.shelf-title { font-family: var(--font-display); font-size: 1.35rem; margin: 0 0 -8px; color: #fff; font-weight: 400; }
.decks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.deck { position: relative; text-align: left; border-radius: 22px; padding: 14px 14px 16px; min-height: 138px;
  background: var(--c); color: var(--fg); display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 6px 0 rgba(0,0,0,.38); transition: transform .08s ease, box-shadow .08s ease; }
.deck:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.38); }
.deck .badge { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.28); display: grid; place-items: center; }
.deck .name { font-family: var(--font-display); font-size: 1.18rem; line-height: 1.08; margin-top: auto; }
.deck .count { font-size: .82rem; font-weight: 800; opacity: .78; }
.deck-wrap { position: relative; display: flex; }
.deck-wrap.wide { grid-column: 1 / -1; }
.deck { width: 100%; }
.info { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--card); color: var(--ink);
  border: 2.5px solid var(--ink); font-family: var(--font-display); font-size: 1.15rem; line-height: 1; display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink); }
.info:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.topbar .info { position: static; width: 40px; height: 40px; }
.rules { font-weight: 700; font-size: 1.05rem; line-height: 1.5; margin: 0 0 6px; color: var(--ink); }
.sheet .head { display: flex; align-items: center; gap: 12px; }
.sheet .head .badge { width: 46px; height: 46px; border-radius: 14px; background: var(--c); color: var(--fg); border: 2.5px solid var(--ink); display: grid; place-items: center; flex: none; }
.sheet .head h2 { margin: 0; line-height: 1.05; }
.play { background: var(--ink); color: #fff; border-radius: 18px; padding: 14px; font-family: var(--font-display); font-size: 1.3rem; box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.play:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.deck.wide { min-height: 0; flex-direction: row; align-items: center; gap: 14px;
  background: repeating-linear-gradient(-55deg, #FF6FAE 0 22px, #FFD84A 22px 44px, #1FC7AE 44px 66px, #6C5CFF 66px 88px, #FF5A36 88px 110px); }
.deck.wide .label { background: var(--card); color: var(--ink); border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.deck.wide .badge { background: var(--card); color: var(--ink); flex: none; }
.deck.wide .name { margin: 0; }

/* Level sheet */
.sheet-wrap { position: fixed; inset: 0; background: rgba(10,6,20,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { width: 100%; max-width: 540px; background: var(--card); color: var(--ink); border-radius: 28px 28px 0 0;
  padding: 22px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; margin: 0 0 4px; }
.lvl { text-align: left; border: 3px solid var(--ink); border-radius: 18px; padding: 12px 14px; display: grid; gap: 2px; box-shadow: 0 4px 0 var(--ink); background: var(--card); }
.lvl:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.lvl b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.lvl span { font-weight: 700; font-size: .88rem; color: var(--muted-ink); }
.lvl.rec { background: #E7E3FF; }
.cancel { font-weight: 800; padding: 10px; color: var(--muted-ink); }

/* ---------- Game ---------- */
#game { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; color: var(--fg, #fff); }
.bg-dots { position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(0,0,0,.10) 1.6px, transparent 1.7px); background-size: 20px 20px; z-index: -1; }
.topbar { display: grid; grid-template-columns: 48px 1fr auto auto; align-items: center; gap: 12px; }
.round { width: 48px; height: 48px; border-radius: 50%; background: var(--card); color: var(--ink); display: grid; place-items: center; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.round:disabled { opacity: .45; cursor: default; transform: none; }
.round svg.i { width: 22px; height: 22px; stroke-width: 3; }
.gtitle { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.05; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { background: var(--ink); color: #fff; border-radius: 999px; padding: 7px 12px; font-weight: 900; font-size: .9rem; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 999px; background: rgba(30,22,51,.22); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width .3s ease; }

.table { flex: 1; min-height: 0; position: relative; margin: 6px 6px 18px; }
.sheet-wrap.center { align-items: center; padding: 16px; }
.pop { width: 100%; max-width: 360px; background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 rgba(0,0,0,.45);
  padding: 22px; display: grid; gap: 12px; text-align: center; animation: up .22s ease-out; }
.pop h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 0; }
.pop p { margin: 0; font-weight: 700; line-height: 1.45; color: var(--muted-ink); }
.pop p b { color: var(--ink); }
.demo { position: relative; height: 130px; width: 100px; justify-self: center; margin: 4px 0 6px; }
.demo-back, .demo-card { position: absolute; inset: 0; border: 3px solid var(--ink); border-radius: 16px; background: var(--soft); }
.demo-back { transform: rotate(4deg); }
.demo-card { background: #FF6FAE; box-shadow: 0 5px 0 var(--ink); display: grid; align-content: center; gap: 8px; padding: 0 16px; animation: swipe 1.8s ease-in-out infinite; }
.demo-card span { height: 8px; border-radius: 4px; background: var(--ink); opacity: .85; }
.demo-card span:last-child { width: 60%; }
@keyframes swipe { 0%, 15% { transform: none; opacity: 1; } 55% { transform: translateY(-80px) rotate(-5deg); opacity: 0; } 56% { transform: none; opacity: 0; } 80%, 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .demo-card { animation: none; } .pop { animation: none; } }
.ghost-card { position: absolute; inset: 0; background: var(--card); border: 3px solid var(--ink); border-radius: 28px; }
.ghost-card.g1 { transform: rotate(3.5deg) translate(6px, 4px); opacity: .55; }
.ghost-card.g2 { transform: rotate(-2.5deg) translate(-4px, 6px); opacity: .8; }
.card { position: absolute; inset: 0; background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 28px;
  box-shadow: 0 9px 0 var(--ink); padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;
  touch-action: none; user-select: none; cursor: grab; will-change: transform; }
.card.deal { animation: deal .3s cubic-bezier(.2,.9,.3,1.3); }
@keyframes deal { from { transform: translateY(40px) scale(.94) rotate(-1deg); } }
.card.fly { transition: transform .28s ease-in, opacity .28s ease-in; }
.tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; background: var(--c); color: var(--fg); border: 2.5px solid var(--ink);
  border-radius: 999px; padding: 5px 12px 5px 8px; font-weight: 900; font-size: .9rem; }
.tag svg.i { width: 18px; height: 18px; stroke-width: 2.8; }
.q { font-weight: 900; font-size: clamp(1.55rem, 6.6vw, 2.15rem); line-height: 1.18; margin: auto 0; text-wrap: balance; letter-spacing: -.01em; }
.or { display: grid; gap: 12px; margin: auto 0; }
.or .opt { font-weight: 900; font-size: clamp(1.35rem, 5.8vw, 1.85rem); line-height: 1.18; text-wrap: balance; background: var(--soft); border-radius: 16px; padding: 12px 14px; }
.or .vs { justify-self: center; font-family: var(--font-display); font-size: 1.4rem; background: var(--c); color: var(--fg); border: 2.5px solid var(--ink); border-radius: 12px; padding: 2px 12px; transform: rotate(-4deg); }
.how { font-weight: 700; font-size: .95rem; color: var(--muted-ink); line-height: 1.4; margin: 0; }
.verdicts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.verdicts span { border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 10px; font-weight: 900; font-size: .9rem; color: var(--ink); background: var(--soft); }
.verdicts span:first-child { background: var(--c); color: var(--fg); }

.end { margin: auto 0; display: grid; gap: 16px; justify-items: start; }
.end h2 { font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; margin: 0; line-height: 1; }

.controls { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: stretch; }
.controls .round { width: 64px; height: 64px; }
.next { background: var(--ink); color: #fff; border-radius: 20px; font-family: var(--font-display); font-size: 1.45rem; letter-spacing: .01em;
  box-shadow: 0 6px 0 rgba(0,0,0,.45); border: 3px solid var(--ink); }
.next:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
.swipehint { text-align: center; font-weight: 800; font-size: .82rem; opacity: .8; margin: -4px 0 0; }

@media (prefers-reduced-motion: reduce) {
  .card.deal { animation: none; } .card.fly { transition: none; } body { transition: none; } .sheet { animation: none; }
}
</style>

// Seeded shuffle so a deck keeps its order between visits on this phone.
function seedFrom(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function cardsFor(mode, level) {
  if (mode === "profundas") {
    const lv = level === "subiendo" || level === "todo" ? ["ligero", "profundo", "muy"] : [level];
    return lv.flatMap(l => DATA.profundas[l].map(text => ({ mode, text, level: l })));
  }
  if (mode === "prefieres") return DATA.prefieres.map(([a, b]) => ({ mode, a, b }));
  if (mode === "verdad") return DATA.verdad.map(([kind, text]) => ({ mode, kind, text }));
  if (mode === "mezcla") return Object.keys(MODES).filter(m => m !== "mezcla").flatMap(m => cardsFor(m, "todo"));
  return DATA[mode].map(text => ({ mode, text }));
}
function buildDeck(mode, level, round) {
  const base = `${state.seed}|${mode}|${level}|${round}`;
  if (mode === "profundas" && level === "subiendo") {
    return ["ligero", "profundo", "muy"].flatMap(l => shuffle(cardsFor(mode, l), rng(seedFrom(base + l))));
  }
  return shuffle(cardsFor(mode, level), rng(seedFrom(base)));
}

    return `<div class="deck-wrap"><button class="deck" type="button" data-mode="${k}" style="${vars(k)}"><span class="badge">${icon(k)}</span><span class="name">${m.name}</span><span class="count">${n} cartas</span></button>${info}</div>`;
  }).join("");
  $("lvls").innerHTML = LEVELS.map(([k, n, d], i) => `<button class="lvl${i === 0 ? " rec" : ""}" type="button" data-level="${k}"><b>${n}</b><span>${d}</span></button>`).join("");
}

const progressKey = () => `sm.pos|${state.mode}|${state.level}`;
function save() { store.set(progressKey(), { idx: state.idx, round: state.round }); }

function startMode(mode, level) {
  state.mode = mode; state.level = level || "todo";
  const saved = store.get(progressKey(), { idx: 0, round: 0 });
  state.round = saved.round; state.idx = saved.idx;
  state.deck = buildDeck(mode, state.level, state.round);
  if (state.idx > state.deck.length) state.idx = 0;
  $("home").hidden = true; $("game").hidden = false;
  render("deal");
  if (!store.get("sm.swipeSeen", false)) $("swipePop").hidden = false;
}
function goHome() {
  $("game").hidden = true; $("home").hidden = false;
  document.body.style.backgroundColor = "";
}

const HOW = {
  princess: "Contad 3, 2, 1 y decidlo a la vez.",
  redflag: "Decidid a la vez y explicad por qué.",
  adivina: "Quien tenga la carta adivina primero. La otra persona dice si ha acertado.",
  prefieres: "Elegid a la vez y defended vuestra respuesta.",
  hot: "¿De acuerdo o no? Gana quien convenza a la otra persona.",
  yonunca: "Si lo has hecho, confiesa y cuenta la historia.",
  verdad: "Os turnáis: una carta para cada persona.",
  probable: "Señalad a la vez a la persona que creéis.",
  completa: "Termina la frase en voz alta. Luego le toca a la otra persona.",
  termometro: "Del 1 al 10, ¿cómo estás ahora mismo con esto? Decid el número a la vez y luego explicadlo.",
  dosverdades: "Di dos verdades y una mentira sobre este tema. La otra persona adivina cuál es la mentira."
};
const VERDICTS = { princess: ["Princess treatment", "Bare minimum", "Red flag"], redflag: ["Green flag", "Red flag", "Depende"] };

function cardHTML(c) {
  let tag = c.kind || MODES[c.mode].tag;
  let body;
  if (c.mode === "prefieres") body = `<div class="or"><div class="opt">${c.a}</div><div class="vs">o</div><div class="opt">${c.b}</div></div>`;
  else if (c.mode === "hot") body = `<p class="q">«${c.text}»</p>`;
  else if (c.mode === "yonunca") body = `<p class="q">Yo nunca ${c.text}</p>`;
  else body = `<p class="q">${c.text}</p>`;
  const v = VERDICTS[c.mode] ? `<div class="verdicts">${VERDICTS[c.mode].map(x => `<span>${x}</span>`).join("")}</div>` : "";
  const how = HOW[c.mode] ? `<div>${v}<p class="how">${HOW[c.mode]}</p></div>` : "";
  return `<span class="tag">${icon(c.mode)}${tag}</span>${body}${how}`;
}

function render(anim) {
  const total = state.deck.length, done = state.idx >= total, c = state.deck[state.idx];
  const colorMode = done ? (state.mode === "mezcla" ? "profundas" : state.mode) : c.mode;
  const m = MODES[colorMode];
  document.body.style.backgroundColor = m.c;
  $("game").style.cssText = vars(colorMode);
  const lvl = "";
  $("gtitle").textContent = lvl ? `Profundas: ${lvl.toLowerCase()}` : (MODES[state.mode].short || MODES[state.mode].name);
  $("count").textContent = `${Math.min(state.idx + 1, total)}/${total}`;
  $("barfill").style.width = `${(Math.min(state.idx, total) / total) * 100}%`;
  const table = $("table");
  table.innerHTML = `<div class="ghost-card g1"></div><div class="ghost-card g2"></div>` + (done
    ? `<div class="card"><div class="end"><h2>¡Mazo terminado!</h2><p class="how">Habéis pasado las ${total} cartas.</p><button class="next" style="padding:14px 22px" type="button" id="reshuffle">Barajar otra vez</button></div></div>`
    : `<div class="card${anim === "deal" ? " deal" : ""}">${cardHTML(c)}</div>`);
  if (done) $("reshuffle").onclick = () => { state.round++; state.idx = 0; state.deck = buildDeck(state.mode, state.level, state.round); save(); render("deal"); };
  else bindDrag(table.querySelector(".card"));
  save();
}

let busy = false;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function throwCard(dir) {
  if (busy) return;
  if (dir > 0 && state.idx >= state.deck.length) return;
  if (dir < 0 && state.idx === 0) return;
  const card = $("table").querySelector(".card");
  const after = () => { busy = false; state.idx += dir; render("deal"); };
  if (!card || reduced || dir < 0) { after(); return; }
  busy = true;
  card.classList.add("fly");
  card.style.transform = `translateY(-130%) rotate(-6deg)`;
  card.style.opacity = "0";
  setTimeout(after, 260);
}

function bindDrag(el) {
  let y0 = null, dy = 0;
  el.addEventListener("pointerdown", e => { if (busy) return; y0 = e.clientY; dy = 0; el.setPointerCapture(e.pointerId); el.classList.remove("deal"); });
  el.addEventListener("pointermove", e => {
    if (y0 == null) return;
    dy = e.clientY - y0;
    el.style.transform = `translateY(${dy}px) rotate(${dy / 60}deg)`;
  });
  const end = () => {
    if (y0 == null) return; y0 = null;
    if (dy < -80 && state.idx < state.deck.length) {
      busy = true; el.classList.add("fly");
      el.style.transform = `translateY(-140%) rotate(-6deg)`; el.style.opacity = "0";
      setTimeout(() => { busy = false; state.idx++; render("deal"); }, 240);
    } else if (dy > 80 && state.idx > 0) {
      state.idx--; render("deal");
    } else {
      el.classList.add("fly"); el.style.transform = "";
      setTimeout(() => el.classList.remove("fly"), 280);
    }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function openMode(mode) {
  startMode(mode);
}
let infoMode = null;
function openInfo(mode) {
  infoMode = mode;
  $("infoPanel").style.cssText = mode === "mezcla" ? "--c:#FFD84A;--fg:#1E1633;" : vars(mode);
  $("infoIcon").innerHTML = icon(mode);
  $("infoTitle").textContent = MODES[mode].name;
  $("infoText").textContent = RULES[mode];
  const inGame = !$("game").hidden;
  $("infoPlay").textContent = inGame ? "Seguir jugando" : "Jugar";
  $("infoClose").hidden = inGame;
  $("infoSheet").hidden = false;
}
$("infoPlay").onclick = () => { $("infoSheet").hidden = true; if ($("game").hidden) openMode(infoMode); };
$("infoClose").onclick = () => { $("infoSheet").hidden = true; };
$("infoSheet").addEventListener("click", e => { if (e.target.id === "infoSheet") $("infoSheet").hidden = true; });
$("gameInfo").onclick = () => openInfo(state.mode === "mezcla" ? state.deck[Math.min(state.idx, state.deck.length - 1)].mode : state.mode);
$("decks").addEventListener("click", e => {
  const i = e.target.closest("[data-info]"); if (i) { openInfo(i.dataset.info); return; }
  const b = e.target.closest("[data-mode]"); if (!b) return;
  openMode(b.dataset.mode);
});
$("lvls").addEventListener("click", e => {
  const b = e.target.closest("[data-level]"); if (!b) return;
  $("sheet").hidden = true; startMode("profundas", b.dataset.level);
});
$("cancelSheet").onclick = () => { $("sheet").hidden = true; };
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") $("sheet").hidden = true; });
$("back").onclick = goHome;
$("swipeOk").onclick = () => { $("swipePop").hidden = true; store.set("sm.swipeSeen", true); };
document.addEventListener("keydown", e => {
  if (!$("swipePop").hidden) { if (e.key === "Escape" || e.key === "Enter") $("swipeOk").click(); return; }
  if (!$("infoSheet").hidden) { if (e.key === "Escape") $("infoSheet").hidden = true; return; }
  if (!$("sheet").hidden && e.key === "Escape") { $("sheet").hidden = true; return; }
  if ($("game").hidden) return;
  if (e.key === "ArrowUp" || e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); throwCard(1); }
  if (e.key === "ArrowDown" || e.key === "ArrowLeft") { e.preventDefault(); throwCard(-1); }
  if (e.key === "Escape") goHome();
});

renderHome();
</script>

</body>
</html>
